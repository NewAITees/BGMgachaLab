[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bgm-gacha-lab"
version = "0.1.0"
description = "CLI tool for batch generating lofi/chill backgrounds with MusicGen"
readme = "README.md"
authors = [{ name = "BGM Gacha Lab" }]
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.13"
dependencies = [
  "audiocraft @ git+https://github.com/facebookresearch/audiocraft.git",
  "torch",
  "transformers==4.57.1",
  "huggingface_hub==0.34.4",
  "soundfile",
  "music21==9.9.1",
  "mido==1.3.3",
  "pianoplayer==3.0.2",
  "pretty_midi==0.2.11",
  "typer>=0.9",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
]

[project.scripts]
"bgm-gacha" = "bgm_gacha_lab.cli:app"

[tool.setuptools.package-data]
bgm_gacha_lab = ["py.typed"]

[tool.setuptools.packages.find]
include = ["bgm_gacha_lab*"]

[tool.ruff]
extend-exclude = ["third_party"]
